<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Background Glow Filter -->
    <filter id="ai-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Linear Gradients -->
    <linearGradient id="flame-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff4500" />
      <stop offset="45%" stop-color="#ff7a00" />
      <stop offset="85%" stop-color="#ffb703" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>

    <linearGradient id="bowl-body-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <linearGradient id="rim-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6b35" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <linearGradient id="soup-liquid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b35" />
      <stop offset="60%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>

    <linearGradient id="cyber-node-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>

  <!-- Ambient Outer Glow -->
  <ellipse cx="50" cy="68" rx="36" ry="14" fill="#ff6b35" opacity="0.18" filter="url(#ai-glow)" />

  <!-- Cybernetic Neural Steam Waves -->
  <!-- Left Steam Ribbon -->
  <path d="M36 50 C32 38, 44 30, 38 18 C36 14, 32 12, 34 8" 
        fill="none" 
        stroke="url(#flame-grad)" 
        stroke-width="2.5" 
        stroke-linecap="round" 
        opacity="0.85" />
  
  <!-- Center Main Neural Steam Plume -->
  <path d="M50 48 C46 36, 56 26, 49 14 C47 10, 50 6, 51 4" 
        fill="none" 
        stroke="url(#flame-grad)" 
        stroke-width="3.2" 
        stroke-linecap="round" 
        filter="url(#ai-glow)" />

  <!-- Right Steam Ribbon -->
  <path d="M64 50 C68 38, 56 30, 62 18 C64 14, 68 12, 66 8" 
        fill="none" 
        stroke="url(#flame-grad)" 
        stroke-width="2.5" 
        stroke-linecap="round" 
        opacity="0.85" />

  <!-- Neural Sparks & AI Nodes -->
  <!-- Center Top AI Sparkle -->
  <path d="M51 1 L52.5 5 L56.5 6.5 L52.5 8 L51 12 L49.5 8 L45.5 6.5 L49.5 5 Z" 
        fill="#fef08a" 
        filter="url(#ai-glow)" />

  <!-- Left Node -->
  <circle cx="34" cy="8" r="2.2" fill="url(#cyber-node-grad)" filter="url(#ai-glow)" />
  <circle cx="38" cy="18" r="1.5" fill="#fef08a" />

  <!-- Right Node -->
  <circle cx="66" cy="8" r="2.2" fill="url(#cyber-node-grad)" filter="url(#ai-glow)" />
  <circle cx="62" cy="18" r="1.5" fill="#fef08a" />

  <!-- Synapse Connectors -->
  <line x1="38" y1="18" x2="49" y2="14" stroke="#818cf8" stroke-width="0.75" stroke-dasharray="2,2" opacity="0.6" />
  <line x1="62" y1="18" x2="49" y2="14" stroke="#818cf8" stroke-width="0.75" stroke-dasharray="2,2" opacity="0.6" />

  <!-- Base Shadow Ring -->
  <ellipse cx="50" cy="88" rx="20" ry="4" fill="#000" opacity="0.6" />

  <!-- Main Bowl Hull -->
  <path d="M15 54 C15 76, 31 88, 50 88 C69 88, 85 76, 85 54 Z" 
        fill="url(#bowl-body-grad)" 
        stroke="rgba(255, 255, 255, 0.12)" 
        stroke-width="1.2" />

  <!-- Sleek Bowl Pedestal Foot -->
  <path d="M38 87 L35 91 C35 92.5, 65 92.5, 65 91 L62 87 Z" 
        fill="#0b111e" 
        stroke="rgba(255, 255, 255, 0.08)" 
        stroke-width="1" />

  <!-- Liquid Soup Surface Interior -->
  <ellipse cx="50" cy="54" rx="34" ry="12" fill="url(#soup-liquid)" />

  <!-- Inner Liquid Swirl / Shimmer -->
  <ellipse cx="50" cy="54.5" rx="28" ry="9" fill="#ea580c" opacity="0.8" />
  <ellipse cx="48" cy="55" rx="20" ry="5.5" fill="#ff7a00" opacity="0.6" />

  <!-- Neon Glowing Cyber Rim -->
  <ellipse cx="50" cy="54" rx="35" ry="12.5" 
           fill="none" 
           stroke="url(#rim-grad)" 
           stroke-width="2.2" 
           filter="url(#ai-glow)" />

  <!-- High-Tech Circuit Accent on Bowl Front -->
  <path d="M35 70 L45 77 L55 77 L65 70" 
        fill="none" 
        stroke="rgba(99, 102, 241, 0.4)" 
        stroke-width="1.2" 
        stroke-linecap="round" />
  <circle cx="50" cy="77" r="1.8" fill="#818cf8" />
</svg>
